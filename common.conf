# Shared settings, symlinked into each <distro>/mkosi.conf.d/.

[Output]
Format=oci
CompressOutput=zstd
CompressLevel=19
OutputDirectory=mkosi.output

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
# Give each container its own machine ID.
RemoveFiles=/etc/machine-id
# Shared files next to this one, such as the nonroot user.
ExtraTrees=%C/mkosi.extra

[Build]
ToolsTree=default
