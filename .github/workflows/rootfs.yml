# Builds each variant with mkosi and pushes <variant> (multi-arch) and <variant>-<arch> tags.
name: rootfs

on:
  workflow_call:
    inputs:
      distro:
        type: string
        required: true
      variants:
        type: string
        required: true
      tags:
        type: string
        default: "{}"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.distro }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: ${{ inputs.distro }}
    env:
      CONFIG: ${{ matrix.variant }}.conf
      LAYOUT: mkosi.output/${{ inputs.distro }}-${{ matrix.variant }}:${{ inputs.distro }}-${{ matrix.variant }}
      TAG: ${{ matrix.variant }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: systemd/mkosi@v27.1
      - uses: oras-project/setup-oras@v2.0.2
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo mkosi --include "$CONFIG" --force build
      - run: oras cp --from-oci-layout "$LAYOUT" "${IMAGE,,}:$TAG"

  index:
    needs: build
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    runs-on: ubuntu-26.04
    env:
      TAGS: ${{ fromJSON(inputs.tags)[matrix.variant] || matrix.variant }}
      SOURCES: ${{ matrix.variant }}-amd64 ${{ matrix.variant }}-arm64
    steps:
      - uses: oras-project/setup-oras@v2.0.2
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: oras manifest index create "${IMAGE,,}:$TAGS" $SOURCES
