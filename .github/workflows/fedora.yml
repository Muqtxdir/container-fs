name: fedora

on:
  push:
    branches: [main]
    paths:
      - fedora/**
      - common.conf
      - mkosi.extra/**
      - .github/workflows/fedora.yml
      - .github/workflows/rootfs.yml
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rootfs:
    uses: ./.github/workflows/rootfs.yml
    with:
      distro: fedora
      variants: '["latest", "rawhide"]'
